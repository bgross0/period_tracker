<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Luna - Period Tracker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');

        * {
            font-family: 'Inter', sans-serif;
        }

        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #f5f7fa 0%, #e8eef5 100%);
        }

        .gradient-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .fade-in {
            animation: fadeIn 0.3s ease-out;
        }

        .phase-menstrual { background: linear-gradient(135deg, #ff6b9d 0%, #c06c84 100%); }
        .phase-follicular { background: linear-gradient(135deg, #a8e6cf 0%, #3eecac 100%); }
        .phase-ovulation { background: linear-gradient(135deg, #ffd89b 0%, #19547b 100%); }
        .phase-luteal { background: linear-gradient(135deg, #fbc2eb 0%, #a6c1ee 100%); }
    </style>
</head>
<body>
    <div id="root"></div>

    <script>
        const API_URL = 'https://period-tracker-api.ben-8b4.workers.dev';

        // State Management
        const AppState = {
            token: localStorage.getItem('auth_token'),
            user: null,
            currentView: 'login',

            setToken(token) {
                this.token = token;
                localStorage.setItem('auth_token', token);
            },

            clearToken() {
                this.token = null;
                localStorage.removeItem('auth_token');
            },

            async fetchWithAuth(endpoint, options = {}) {
                const headers = {
                    'Content-Type': 'application/json',
                    ...options.headers
                };

                if (this.token) {
                    headers['Authorization'] = `Bearer ${this.token}`;
                }

                const response = await fetch(`${API_URL}${endpoint}`, {
                    ...options,
                    headers
                });

                if (response.status === 401) {
                    this.clearToken();
                    this.currentView = 'login';
                    render();
                }

                return response;
            }
        };

        // Auth Components
        function LoginView() {
            const el = document.createElement('div');
            el.className = 'min-h-screen flex items-center justify-center px-4';
            el.innerHTML = `
                <div class="max-w-md w-full bg-white rounded-2xl shadow-2xl p-8 fade-in">
                    <div class="text-center mb-8">
                        <h1 class="text-4xl font-bold text-gray-800 mb-2">🌙 Luna</h1>
                        <p class="text-gray-600">Simple, private period tracking</p>
                    </div>

                    <div id="auth-tabs" class="flex mb-6 bg-gray-100 rounded-lg p-1">
                        <button class="auth-tab flex-1 py-2 rounded-md transition-all duration-200 font-medium" data-tab="login">
                            Login
                        </button>
                        <button class="auth-tab flex-1 py-2 rounded-md transition-all duration-200 font-medium" data-tab="register">
                            Sign Up
                        </button>
                    </div>

                    <div id="login-form">
                        <input type="email" id="login-email" placeholder="Email"
                            class="w-full px-4 py-3 mb-3 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-purple-500">
                        <input type="password" id="login-password" placeholder="Password"
                            class="w-full px-4 py-3 mb-4 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-purple-500">
                        <button id="login-btn" class="w-full py-3 bg-gradient-to-r from-purple-600 to-purple-700 text-white rounded-lg font-semibold hover:shadow-lg transition-all duration-200">
                            Login
                        </button>
                    </div>

                    <div id="register-form" class="hidden">
                        <input type="text" id="register-name" placeholder="Name"
                            class="w-full px-4 py-3 mb-3 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-purple-500">
                        <input type="email" id="register-email" placeholder="Email"
                            class="w-full px-4 py-3 mb-3 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-purple-500">
                        <input type="password" id="register-password" placeholder="Password"
                            class="w-full px-4 py-3 mb-4 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-purple-500">
                        <button id="register-btn" class="w-full py-3 bg-gradient-to-r from-purple-600 to-purple-700 text-white rounded-lg font-semibold hover:shadow-lg transition-all duration-200">
                            Sign Up
                        </button>
                    </div>

                    <div id="auth-error" class="mt-4 text-red-600 text-sm text-center hidden"></div>
                </div>
            `;

            // Tab switching
            const tabs = el.querySelectorAll('.auth-tab');
            const loginForm = el.querySelector('#login-form');
            const registerForm = el.querySelector('#register-form');

            tabs.forEach(tab => {
                tab.addEventListener('click', () => {
                    tabs.forEach(t => {
                        t.classList.remove('bg-white', 'shadow-sm', 'text-purple-600');
                        t.classList.add('text-gray-600');
                    });
                    tab.classList.add('bg-white', 'shadow-sm', 'text-purple-600');
                    tab.classList.remove('text-gray-600');

                    if (tab.dataset.tab === 'login') {
                        loginForm.classList.remove('hidden');
                        registerForm.classList.add('hidden');
                    } else {
                        loginForm.classList.add('hidden');
                        registerForm.classList.remove('hidden');
                    }
                });
            });

            // Set initial active tab
            tabs[0].classList.add('bg-white', 'shadow-sm', 'text-purple-600');

            // Login
            el.querySelector('#login-btn').addEventListener('click', async () => {
                const email = el.querySelector('#login-email').value;
                const password = el.querySelector('#login-password').value;
                const errorDiv = el.querySelector('#auth-error');

                try {
                    const response = await fetch(`${API_URL}/auth/login`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ email, password })
                    });

                    const data = await response.json();

                    if (response.ok) {
                        AppState.setToken(data.token);
                        AppState.user = data;

                        // Check if needs onboarding
                        if (data.needs_onboarding) {
                            AppState.currentView = 'onboarding';
                        } else {
                            AppState.currentView = 'dashboard';
                        }
                        render();
                    } else {
                        errorDiv.textContent = data.error || 'Login failed';
                        errorDiv.classList.remove('hidden');
                    }
                } catch (error) {
                    errorDiv.textContent = 'Network error. Please try again.';
                    errorDiv.classList.remove('hidden');
                }
            });

            // Register
            el.querySelector('#register-btn').addEventListener('click', async () => {
                const name = el.querySelector('#register-name').value;
                const email = el.querySelector('#register-email').value;
                const password = el.querySelector('#register-password').value;
                const errorDiv = el.querySelector('#auth-error');

                try {
                    const response = await fetch(`${API_URL}/auth/register`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ name, email, password })
                    });

                    const data = await response.json();

                    if (response.ok) {
                        AppState.setToken(data.token);
                        AppState.user = data;
                        AppState.currentView = 'onboarding';
                        render();
                    } else {
                        errorDiv.textContent = data.error || 'Registration failed';
                        errorDiv.classList.remove('hidden');
                    }
                } catch (error) {
                    errorDiv.textContent = 'Network error. Please try again.';
                    errorDiv.classList.remove('hidden');
                }
            });

            return el;
        }

        // Onboarding View
        function OnboardingView() {
            const el = document.createElement('div');
            el.className = 'min-h-screen flex items-center justify-center px-4 py-8';
            el.innerHTML = `
                <div class="max-w-2xl w-full bg-white rounded-2xl shadow-2xl p-8 fade-in">
                    <h2 class="text-3xl font-bold text-gray-800 mb-2">Welcome to Luna! 🌙</h2>
                    <p class="text-gray-600 mb-8">Let's personalize your tracking experience</p>

                    <div class="space-y-6">
                        <div>
                            <label class="block text-sm font-semibold text-gray-700 mb-2">
                                When did your last period start?
                            </label>
                            <input type="date" id="last-period"
                                class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-purple-500">
                        </div>

                        <div>
                            <label class="block text-sm font-semibold text-gray-700 mb-2">
                                Average cycle length (days)
                            </label>
                            <input type="number" id="cycle-length" value="28" min="21" max="40"
                                class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-purple-500">
                        </div>

                        <div>
                            <label class="block text-sm font-semibold text-gray-700 mb-4">
                                What would you like to track?
                            </label>
                            <div class="grid grid-cols-2 gap-3">
                                <label class="flex items-center p-3 rounded-lg border border-gray-300 cursor-pointer hover:bg-gray-50">
                                    <input type="checkbox" id="track-mood" checked class="mr-3 w-5 h-5 text-purple-600">
                                    <span>😊 Mood</span>
                                </label>
                                <label class="flex items-center p-3 rounded-lg border border-gray-300 cursor-pointer hover:bg-gray-50">
                                    <input type="checkbox" id="track-energy" checked class="mr-3 w-5 h-5 text-purple-600">
                                    <span>⚡ Energy</span>
                                </label>
                                <label class="flex items-center p-3 rounded-lg border border-gray-300 cursor-pointer hover:bg-gray-50">
                                    <input type="checkbox" id="track-flow" checked class="mr-3 w-5 h-5 text-purple-600">
                                    <span>🩸 Flow</span>
                                </label>
                                <label class="flex items-center p-3 rounded-lg border border-gray-300 cursor-pointer hover:bg-gray-50">
                                    <input type="checkbox" id="track-symptoms" checked class="mr-3 w-5 h-5 text-purple-600">
                                    <span>🤕 Symptoms</span>
                                </label>
                                <label class="flex items-center p-3 rounded-lg border border-gray-300 cursor-pointer hover:bg-gray-50">
                                    <input type="checkbox" id="track-sleep" checked class="mr-3 w-5 h-5 text-purple-600">
                                    <span>😴 Sleep</span>
                                </label>
                                <label class="flex items-center p-3 rounded-lg border border-gray-300 cursor-pointer hover:bg-gray-50">
                                    <input type="checkbox" id="track-remedies" checked class="mr-3 w-5 h-5 text-purple-600">
                                    <span>💊 Remedies</span>
                                </label>
                            </div>
                        </div>

                        <button id="complete-onboarding"
                            class="w-full py-4 bg-gradient-to-r from-purple-600 to-purple-700 text-white rounded-lg font-semibold text-lg hover:shadow-lg transition-all duration-200">
                            Let's Go! 🚀
                        </button>
                    </div>

                    <div id="onboarding-error" class="mt-4 text-red-600 text-sm text-center hidden"></div>
                </div>
            `;

            el.querySelector('#complete-onboarding').addEventListener('click', async () => {
                const lastPeriod = el.querySelector('#last-period').value;
                const cycleLength = parseInt(el.querySelector('#cycle-length').value);
                const errorDiv = el.querySelector('#onboarding-error');

                if (!lastPeriod) {
                    errorDiv.textContent = 'Please enter your last period start date';
                    errorDiv.classList.remove('hidden');
                    return;
                }

                const onboardingData = {
                    last_period_start: lastPeriod,
                    average_cycle_length: cycleLength,
                    average_period_length: 5,
                    regularity: 'regular',
                    track_mood: el.querySelector('#track-mood').checked,
                    track_energy: el.querySelector('#track-energy').checked,
                    track_flow: el.querySelector('#track-flow').checked,
                    track_symptoms: el.querySelector('#track-symptoms').checked,
                    track_sleep: el.querySelector('#track-sleep').checked,
                    track_remedies: el.querySelector('#track-remedies').checked
                };

                try {
                    const response = await AppState.fetchWithAuth('/onboarding', {
                        method: 'POST',
                        body: JSON.stringify(onboardingData)
                    });

                    const data = await response.json();

                    if (response.ok) {
                        AppState.currentView = 'dashboard';
                        render();
                    } else {
                        errorDiv.textContent = data.error || 'Onboarding failed';
                        errorDiv.classList.remove('hidden');
                    }
                } catch (error) {
                    errorDiv.textContent = 'Network error. Please try again.';
                    errorDiv.classList.remove('hidden');
                }
            });

            return el;
        }

        // Dashboard View - REAL IMPLEMENTATION
        function DashboardView() {
            const el = document.createElement('div');
            el.className = 'min-h-screen bg-gray-50';

            // Initial render with loading state
            el.innerHTML = `
                <div class="gradient-header text-white py-6 shadow-lg">
                    <div class="max-w-7xl mx-auto px-4 flex justify-between items-center">
                        <div>
                            <h1 class="text-2xl font-bold">🌙 Luna</h1>
                            <p class="text-sm text-purple-100">Period Tracker</p>
                        </div>
                        <button id="logout-btn" class="px-4 py-2 bg-white/20 rounded-lg hover:bg-white/30 transition-all">
                            Logout
                        </button>
                    </div>
                </div>

                <div id="dashboard-content" class="max-w-7xl mx-auto px-4 py-8">
                    <div class="text-center py-12">
                        <div class="inline-block animate-spin rounded-full h-12 w-12 border-b-2 border-purple-600"></div>
                        <p class="mt-4 text-gray-600">Loading your dashboard...</p>
                    </div>
                </div>
            `;

            el.querySelector('#logout-btn').addEventListener('click', () => {
                AppState.clearToken();
                AppState.user = null;
                AppState.currentView = 'login';
                render();
            });

            // Load dashboard data
            loadDashboardData(el);

            return el;
        }

        async function loadDashboardData(el) {
            const contentDiv = el.querySelector('#dashboard-content');

            try {
                // Fetch dashboard data
                const dashboardRes = await AppState.fetchWithAuth('/dashboard');
                const dashboard = await dashboardRes.json();

                // Fetch streak data
                const streakRes = await AppState.fetchWithAuth('/streaks');
                const streak = await streakRes.json();

                // Get today's date for logging
                const today = new Date().toISOString().split('T')[0];

                // Render actual dashboard
                contentDiv.innerHTML = `
                    <!-- Cycle Info Card -->
                    <div class="bg-gradient-to-r from-purple-500 to-purple-600 rounded-2xl shadow-xl p-6 mb-6 text-white">
                        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                            <div>
                                <p class="text-purple-100 text-sm mb-1">Cycle Day</p>
                                <p class="text-4xl font-bold">${dashboard.cycle_day || '—'}</p>
                            </div>
                            <div>
                                <p class="text-purple-100 text-sm mb-1">Phase</p>
                                <p class="text-2xl font-semibold capitalize">${dashboard.phase || 'Unknown'}</p>
                            </div>
                            <div>
                                <p class="text-purple-100 text-sm mb-1">Next Period</p>
                                <p class="text-xl font-semibold">${dashboard.next_period ? formatDate(dashboard.next_period) : 'Calculating...'}</p>
                            </div>
                        </div>
                    </div>

                    <!-- Streak Card -->
                    <div class="bg-white rounded-2xl shadow-lg p-6 mb-6">
                        <div class="flex items-center justify-between">
                            <div>
                                <h3 class="text-lg font-semibold text-gray-800 mb-2">🔥 Streak</h3>
                                <p class="text-3xl font-bold text-purple-600">${streak.current_streak || 0} days</p>
                                <p class="text-sm text-gray-600 mt-1">Longest: ${streak.longest_streak || 0} days • Total logs: ${streak.total_logs || 0}</p>
                            </div>
                            <div class="text-6xl">🔥</div>
                        </div>
                    </div>

                    <!-- Quick Log Today -->
                    <div class="bg-white rounded-2xl shadow-lg p-6 mb-6">
                        <h3 class="text-xl font-bold text-gray-800 mb-4">📝 Log Today</h3>
                        <div id="quick-log-form" class="space-y-4">
                            <div class="grid grid-cols-2 gap-4">
                                <div>
                                    <label class="block text-sm font-medium text-gray-700 mb-2">Mood (1-5)</label>
                                    <input type="range" id="mood-input" min="1" max="5" value="3"
                                        class="w-full h-2 bg-gray-200 rounded-lg appearance-none cursor-pointer accent-purple-600">
                                    <div class="text-center mt-1 text-sm text-gray-600"><span id="mood-value">3</span>/5</div>
                                </div>
                                <div>
                                    <label class="block text-sm font-medium text-gray-700 mb-2">Energy (1-5)</label>
                                    <input type="range" id="energy-input" min="1" max="5" value="3"
                                        class="w-full h-2 bg-gray-200 rounded-lg appearance-none cursor-pointer accent-purple-600">
                                    <div class="text-center mt-1 text-sm text-gray-600"><span id="energy-value">3</span>/5</div>
                                </div>
                            </div>

                            <div id="context-questions">
                                <!-- Context-aware questions will load here -->
                            </div>

                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-2">Notes (optional)</label>
                                <textarea id="notes-input" rows="2"
                                    class="w-full px-4 py-2 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-purple-500"
                                    placeholder="How are you feeling today?"></textarea>
                            </div>

                            <button id="submit-log-btn"
                                class="w-full py-3 bg-gradient-to-r from-purple-600 to-purple-700 text-white rounded-lg font-semibold hover:shadow-lg transition-all">
                                Save Log
                            </button>
                            <div id="log-error" class="text-red-600 text-sm hidden"></div>
                            <div id="log-success" class="text-green-600 text-sm hidden"></div>
                        </div>
                    </div>

                    <!-- Remedy Suggestions -->
                    <div class="bg-white rounded-2xl shadow-lg p-6 mb-6">
                        <h3 class="text-xl font-bold text-gray-800 mb-4">💊 Remedies</h3>
                        <div id="remedy-container">
                            <p class="text-gray-600 text-sm">Log symptoms to get remedy suggestions!</p>
                        </div>
                    </div>

                    <!-- AI Chat -->
                    <div class="bg-white rounded-2xl shadow-lg p-6">
                        <h3 class="text-xl font-bold text-gray-800 mb-4">💬 AI Assistant</h3>
                        <div id="chat-messages" class="space-y-3 mb-4 max-h-64 overflow-y-auto">
                            <div class="bg-gray-100 rounded-lg p-3 text-sm text-gray-700">
                                Hi! I'm here to help you understand your cycle patterns and suggest remedies. Ask me anything!
                            </div>
                        </div>
                        <div class="flex gap-2">
                            <input type="text" id="chat-input" placeholder="Ask about your cycle, symptoms, remedies..."
                                class="flex-1 px-4 py-2 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-purple-500">
                            <button id="send-chat-btn"
                                class="px-6 py-2 bg-purple-600 text-white rounded-lg font-semibold hover:bg-purple-700 transition-all">
                                Send
                            </button>
                        </div>
                        <div id="chat-error" class="text-red-600 text-sm mt-2 hidden"></div>
                    </div>
                `;

                // Setup sliders
                const moodInput = contentDiv.querySelector('#mood-input');
                const moodValue = contentDiv.querySelector('#mood-value');
                const energyInput = contentDiv.querySelector('#energy-input');
                const energyValue = contentDiv.querySelector('#energy-value');

                moodInput.addEventListener('input', (e) => {
                    moodValue.textContent = e.target.value;
                });

                energyInput.addEventListener('input', (e) => {
                    energyValue.textContent = e.target.value;
                });

                // Load context-aware questions
                loadContextQuestions(contentDiv, today);

                // Submit log
                contentDiv.querySelector('#submit-log-btn').addEventListener('click', async () => {
                    const btn = contentDiv.querySelector('#submit-log-btn');
                    const errorDiv = contentDiv.querySelector('#log-error');
                    const successDiv = contentDiv.querySelector('#log-success');

                    btn.disabled = true;
                    btn.textContent = 'Saving...';
                    errorDiv.classList.add('hidden');
                    successDiv.classList.add('hidden');

                    const logData = {
                        log_date: today,
                        mood: parseInt(moodInput.value),
                        energy: parseInt(energyInput.value),
                        notes: contentDiv.querySelector('#notes-input').value || null
                    };

                    // Add flow if in menstrual phase
                    const flowInput = contentDiv.querySelector('#flow-input');
                    if (flowInput) {
                        logData.flow_level = parseInt(flowInput.value);
                    }

                    try {
                        const response = await AppState.fetchWithAuth('/logs', {
                            method: 'POST',
                            body: JSON.stringify(logData)
                        });

                        const result = await response.json();

                        if (response.ok) {
                            successDiv.textContent = '✅ Log saved! Streak updated!';
                            successDiv.classList.remove('hidden');

                            // Reload dashboard after 1 second
                            setTimeout(() => {
                                loadDashboardData(el);
                            }, 1000);
                        } else {
                            errorDiv.textContent = result.error || 'Failed to save log';
                            errorDiv.classList.remove('hidden');
                            btn.disabled = false;
                            btn.textContent = 'Save Log';
                        }
                    } catch (error) {
                        errorDiv.textContent = 'Network error. Please try again.';
                        errorDiv.classList.remove('hidden');
                        btn.disabled = false;
                        btn.textContent = 'Save Log';
                    }
                });

                // Chat functionality
                const chatInput = contentDiv.querySelector('#chat-input');
                const sendBtn = contentDiv.querySelector('#send-chat-btn');
                const chatMessages = contentDiv.querySelector('#chat-messages');
                const chatError = contentDiv.querySelector('#chat-error');

                async function sendMessage() {
                    const message = chatInput.value.trim();
                    if (!message) return;

                    // Add user message
                    const userMsg = document.createElement('div');
                    userMsg.className = 'bg-purple-100 rounded-lg p-3 text-sm text-gray-800 ml-8';
                    userMsg.textContent = message;
                    chatMessages.appendChild(userMsg);
                    chatMessages.scrollTop = chatMessages.scrollHeight;

                    chatInput.value = '';
                    sendBtn.disabled = true;
                    sendBtn.textContent = '...';

                    try {
                        const response = await AppState.fetchWithAuth('/chat', {
                            method: 'POST',
                            body: JSON.stringify({ message })
                        });

                        const data = await response.json();

                        if (response.ok) {
                            const aiMsg = document.createElement('div');
                            aiMsg.className = 'bg-gray-100 rounded-lg p-3 text-sm text-gray-700 mr-8';
                            aiMsg.textContent = data.response;
                            chatMessages.appendChild(aiMsg);
                            chatMessages.scrollTop = chatMessages.scrollHeight;
                        } else {
                            chatError.textContent = data.error || 'Failed to send message';
                            chatError.classList.remove('hidden');
                        }
                    } catch (error) {
                        chatError.textContent = 'Network error';
                        chatError.classList.remove('hidden');
                    }

                    sendBtn.disabled = false;
                    sendBtn.textContent = 'Send';
                }

                sendBtn.addEventListener('click', sendMessage);
                chatInput.addEventListener('keypress', (e) => {
                    if (e.key === 'Enter') sendMessage();
                });

            } catch (error) {
                contentDiv.innerHTML = `
                    <div class="bg-red-50 border border-red-200 rounded-lg p-6 text-center">
                        <p class="text-red-800 font-semibold mb-2">Failed to load dashboard</p>
                        <p class="text-red-600 text-sm">${error.message}</p>
                        <button onclick="location.reload()" class="mt-4 px-4 py-2 bg-red-600 text-white rounded-lg">
                            Retry
                        </button>
                    </div>
                `;
            }
        }

        async function loadContextQuestions(container, date) {
            const questionsDiv = container.querySelector('#context-questions');

            try {
                const response = await AppState.fetchWithAuth(`/daily/questions?date=${date}`);
                const data = await response.json();

                if (data.questions) {
                    const flowQuestion = data.questions.find(q => q.id === 'flow_level');

                    if (flowQuestion) {
                        questionsDiv.innerHTML = `
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-2">${flowQuestion.label} (1-5)</label>
                                <input type="range" id="flow-input" min="1" max="5" value="3"
                                    class="w-full h-2 bg-gray-200 rounded-lg appearance-none cursor-pointer accent-purple-600">
                                <div class="text-center mt-1 text-sm text-gray-600"><span id="flow-value">3</span>/5</div>
                            </div>
                        `;

                        const flowInput = questionsDiv.querySelector('#flow-input');
                        const flowValue = questionsDiv.querySelector('#flow-value');
                        flowInput.addEventListener('input', (e) => {
                            flowValue.textContent = e.target.value;
                        });
                    }
                }
            } catch (error) {
                console.error('Failed to load questions:', error);
            }
        }

        function formatDate(dateStr) {
            const date = new Date(dateStr);
            return date.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
        }

        // Main Render Function
        function render() {
            const root = document.getElementById('root');
            root.innerHTML = '';

            let view;
            if (!AppState.token) {
                view = LoginView();
            } else if (AppState.currentView === 'onboarding') {
                view = OnboardingView();
            } else {
                view = DashboardView();
            }

            root.appendChild(view);
        }

        // Initialize
        if (AppState.token) {
            // Verify token is still valid
            AppState.fetchWithAuth('/users/me')
                .then(res => res.json())
                .then(data => {
                    if (data.user_id) {
                        AppState.user = data;
                        AppState.currentView = 'dashboard';
                    } else {
                        AppState.clearToken();
                        AppState.currentView = 'login';
                    }
                    render();
                })
                .catch(() => {
                    AppState.clearToken();
                    AppState.currentView = 'login';
                    render();
                });
        } else {
            render();
        }
    </script>
</body>
</html>
